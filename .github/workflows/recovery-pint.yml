name: Recovery PHP style normalization

on:
  push:
    branches: [fix/recover-dotted-africa-20261103]
    paths:
      - .github/workflows/recovery-pint.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'johnkiunga01/african-ranked-web-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Apply Laravel Pint and verify PHP-only scope
        run: |
          vendor/bin/pint
          git diff --check
          if git diff --name-only | grep -vE '\.php$'; then
            echo 'Non-PHP files changed; refusing automatic commit'
            exit 1
          fi
          git add -u
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize PHP formatting with Pint'
          git push origin HEAD:fix/recover-dotted-africa-20261103
