<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">What are you measuring?</title><desc id="desc">ACCOUNTS: Wallets registered. One person may hold several accounts. PEOPLE: Individual users. Choose a defined population and period. TRANSACTIONS: Payment activity. Volume does not equal unique users.</desc><rect width="600" height="750" rx="24" fill="#15191b"/><g font-family="Arial, sans-serif"><text x="36" y="43" font-size="16" fill="#ffbf24" font-weight="700">AFRICAN RANKED • EXPLAINED</text><text x="36" y="94" font-size="34" fill="white" font-weight="700">What are you measuring?</text><text x="36" y="181" font-size="22" fill="#d6d3d1" font-weight="400">Three different questions. Three different</text><text x="36" y="208" font-size="22" fill="#d6d3d1" font-weight="400">measures.</text><rect x="30" y="230" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="257" font-size="17" fill="#ffbf24" font-weight="700">ACCOUNTS</text><text x="50" y="293" font-size="29" fill="white" font-weight="700">Wallets registered</text><text x="50" y="326" font-size="20" fill="#e7e5e4" font-weight="400">One person may hold several accounts.</text><rect x="30" y="363" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="390" font-size="17" fill="#ffbf24" font-weight="700">PEOPLE</text><text x="50" y="426" font-size="29" fill="white" font-weight="700">Individual users</text><text x="50" y="459" font-size="20" fill="#e7e5e4" font-weight="400">Choose a defined population and period.</text><rect x="30" y="496" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="523" font-size="17" fill="#ffbf24" font-weight="700">TRANSACTIONS</text><text x="50" y="559" font-size="29" fill="white" font-weight="700">Payment activity</text><text x="50" y="592" font-size="20" fill="#e7e5e4" font-weight="400">Volume does not equal unique users.</text><text x="36" y="663" font-size="18" fill="#d6d3d1" font-weight="400">An editorial explainer, not a country ranking or</text><text x="36" y="687" font-size="18" fill="#d6d3d1" font-weight="400">dataset.</text><text x="36" y="728" font-size="13" fill="#a8a29e" font-weight="400">Original African Ranked infographic • AI-assisted diagram</text></g></svg>