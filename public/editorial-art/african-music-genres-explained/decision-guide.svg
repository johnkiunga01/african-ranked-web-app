<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">Listen beyond the label</title><desc id="desc">RHYTHM: Follow the pulse. Notice repetition, accents and changes. VOICES: Follow the phrasing. Listen for lead, response and layering. INSTRUMENTS: Follow the texture. Compare acoustic and electronic sounds.</desc><rect width="600" height="750" rx="24" fill="#15191b"/><g font-family="Arial, sans-serif"><text x="36" y="43" font-size="16" fill="#ffbf24" font-weight="700">AFRICAN RANKED • EXPLAINED</text><text x="36" y="94" font-size="34" fill="white" font-weight="700">Listen beyond the label</text><text x="36" y="181" font-size="22" fill="#d6d3d1" font-weight="400">A simple framework for comparing recordings.</text><rect x="30" y="230" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="257" font-size="17" fill="#ffbf24" font-weight="700">RHYTHM</text><text x="50" y="293" font-size="29" fill="white" font-weight="700">Follow the pulse</text><text x="50" y="326" font-size="20" fill="#e7e5e4" font-weight="400">Notice repetition, accents and changes.</text><rect x="30" y="363" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="390" font-size="17" fill="#ffbf24" font-weight="700">VOICES</text><text x="50" y="426" font-size="29" fill="white" font-weight="700">Follow the phrasing</text><text x="50" y="459" font-size="20" fill="#e7e5e4" font-weight="400">Listen for lead, response and layering.</text><rect x="30" y="496" width="540" height="118" rx="16" fill="#262b2d"/><text x="50" y="523" font-size="17" fill="#ffbf24" font-weight="700">INSTRUMENTS</text><text x="50" y="559" font-size="29" fill="white" font-weight="700">Follow the texture</text><text x="50" y="592" font-size="20" fill="#e7e5e4" font-weight="400">Compare acoustic and electronic sounds.</text><text x="36" y="663" font-size="18" fill="#d6d3d1" font-weight="400">An editorial listening guide, not a map of genre</text><text x="36" y="687" font-size="18" fill="#d6d3d1" font-weight="400">origins.</text><text x="36" y="728" font-size="13" fill="#a8a29e" font-weight="400">Original African Ranked infographic • AI-assisted diagram</text></g></svg>